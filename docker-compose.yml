services:
  postgres:
    image: postgres:15-alpine
    container_name: razorpay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-razorpay_recon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: archisman2006/razorpay-backend:latest
    container_name: razorpay_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-razorpay_recon}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}

      - RECONCILIATION_MODEL_DIR=/app/tools/ML_Models/Reconciliation Model
      - EXCEPTION_MODEL_DIR=/app/tools/ML_Models/Exception Classification
      - RAG_DOCUMENTS_PATH=/app/docs
      - RAG_VECTOR_DB_PATH=/app/data/rag_vector_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - rag_data:/app/data/rag_vector_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: archisman2006/razorpay-frontend:latest
    container_name: razorpay_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  rag_data:
