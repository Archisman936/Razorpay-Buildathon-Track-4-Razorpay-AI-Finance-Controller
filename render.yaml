# ==============================================================================
# Render Blueprint Specification: Razorpay AI Finance Controller
# ==============================================================================

services:
  # ─── FastAPI Backend Web Service ───────────────────────────────────────────
  - type: web
    name: razorpay-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 20"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONMALLOC
        value: "malloc"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      - key: DATABASE_URL
        fromDatabase:
          name: razorpay-postgres
          property: connectionString
      - key: RECONCILIATION_MODEL_DIR
        value: tools/ML_Models/Reconciliation Model
      - key: EXCEPTION_MODEL_DIR
        value: tools/ML_Models/Exception Classification
      - key: RAG_DOCUMENTS_PATH
        value: docs
      - key: RAG_VECTOR_DB_PATH
        value: data/rag_vector_db
      - key: CORS_ORIGINS
        value: "*"


databases:
  # ─── Managed PostgreSQL Database ───────────────────────────────────────────
  - name: razorpay-postgres
    plan: free
    region: oregon
    databaseName: razorpay_recon
    user: razorpay_user
